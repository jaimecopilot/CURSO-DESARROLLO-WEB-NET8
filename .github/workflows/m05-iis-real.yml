name: M05 - despliegue IIS Windows real
on:
  push:
    branches: [desarrollo/m05-consolidacion-despliegue]
    paths:
      - 'M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/MVC/**'
      - '.github/workflows/m05-iis-real.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iis-windows-real:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Activar IIS en Windows Server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ServerManager
          $feature = Get-WindowsFeature Web-Server
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature Web-Server -IncludeManagementTools
            if (-not $result.Success) { throw 'No se pudo instalar IIS Web-Server' }
            if ($result.RestartNeeded -eq 'Yes') { throw 'El runner requiere reinicio; IIS no se declara probado' }
          }
          Import-Module WebAdministration
          Get-Service W3SVC
      - name: Instalar ASP.NET Core Hosting Bundle para IIS
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'dotnet-hosting-8.exe'
          Invoke-WebRequest 'https://aka.ms/dotnet/8.0/dotnet-hosting-win.exe' -OutFile $installer -UseBasicParsing
          $process=Start-Process -FilePath $installer -ArgumentList @('/install','/quiet','/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "Hosting Bundle installer: $($process.ExitCode)" }
          if ($process.ExitCode -eq 3010) { Write-Host 'Hosting Bundle indicó reinicio; verificar carga de ANCM antes de probar.' }
          $module='C:\Program Files\IIS\Asp.Net Core Module\V2\aspnetcorev2.dll'
          if (-not (Test-Path $module)) { throw "ANCM no instalado en $module" }
          Import-Module WebAdministration
          & iisreset /restart
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo reiniciar IIS' }
      - name: Publicar MVC sin modificar la aplicación fuente
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'M05-IIS-Publicado'
          dotnet publish M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/MVC/CursoWeb.Mvc/CursoWeb.Mvc.csproj -c Release -o $output
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish falló' }
          foreach ($name in @('CursoWeb.Mvc.dll','web.config','wwwroot\css\site.css')) {
            if (-not (Test-Path (Join-Path $output $name))) { throw "Publicación incompleta: $name" }
          }
          '{"Despliegue":{"SinLocalDb":true}}' | Set-Content (Join-Path $output 'appsettings.Production.json') -Encoding UTF8
          Add-Content $env:GITHUB_ENV "M05_IIS_PATH=$output"
      - name: Crear sitio IIS con pool No Managed Code y probar HTTP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Import-Module WebAdministration
          $pool='CursoWeb-M05-Pool'
          $site='CursoWeb-M05'
          if (-not (Test-Path "IIS:\AppPools\$pool")) { New-WebAppPool -Name $pool | Out-Null }
          Set-ItemProperty "IIS:\AppPools\$pool" -Name managedRuntimeVersion -Value ''
          if (Get-Website -Name $site -ErrorAction SilentlyContinue) { Remove-Website -Name $site }
          New-Website -Name $site -PhysicalPath $env:M05_IIS_PATH -Port 8091 -ApplicationPool $pool | Out-Null
          Start-Website $site
          $ok=$false
          for ($i=0;$i -lt 70;$i++) {
            Start-Sleep -Seconds 2
            try {
              $homeResponse=Invoke-WebRequest 'http://127.0.0.1:8091/' -UseBasicParsing -TimeoutSec 5
              $estado=Invoke-WebRequest 'http://127.0.0.1:8091/Productos/Estado' -UseBasicParsing -TimeoutSec 5
              $css=Invoke-WebRequest 'http://127.0.0.1:8091/css/site.css' -UseBasicParsing -TimeoutSec 5
              if ($homeResponse.StatusCode -eq 200 -and $estado.StatusCode -eq 200 -and $css.StatusCode -eq 200) { $ok=$true; break }
            } catch { Write-Host "IIS aún sin respuesta correcta: $_" }
          }
          if (-not $ok) {
            Get-Website | Format-Table -AutoSize
            Get-ChildItem $env:M05_IIS_PATH | Select-Object Name
            throw 'No hubo HTTP 200 real en IIS'
          }
          try {
            Invoke-WebRequest 'http://127.0.0.1:8091/Productos' -UseBasicParsing -TimeoutSec 5 | Out-Null
            throw 'La ruta CRUD no debería responder 200 sin LocalDB'
          } catch [System.Net.WebException] {
            $code=[int]$_.Exception.Response.StatusCode
            if ($code -ne 503) { throw "Esperábamos 503 explícito, recibido $code" }
          }
          Write-Host 'IIS/ANCM real: / 200, /Productos/Estado 200, CSS 200, /Productos 503 esperado'
