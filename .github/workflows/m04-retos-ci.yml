name: M04 - activaciones de retos P4.1 y P4.3
on:
  push:
    branches: [desarrollo/m04-apis-seguridad-trazable]
    paths:
      - 'M04_APIS_SEGURIDAD/PROYECTO/**'
      - '.github/workflows/m04-retos-ci.yml'
  workflow_dispatch:
jobs:
  retos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Activar reto 4.3.5 sobre copia aislada y compilar
        shell: bash
        run: |
          set -euo pipefail
          cp -R M04_APIS_SEGURIDAD/PROYECTO/4.3/CursoWeb.ProductosApi /tmp/p43-reto
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/p43-reto/Program.cs")
          s=p.read_text()
          a=s.index("// RETO 4.3.5 INICIO")
          b=s.index("// RETO 4.3.5 FIN",a)
          block=s[a:b]
          assert block.count("/*")==1 and block.count("*/")==1
          s=s[:a]+block.replace("/*","",1).replace("*/","",1)+s[b:]
          p.write_text(s)
          PY
          dotnet build /tmp/p43-reto/CursoWeb.ProductosApi.csproj -c Release
      - name: Ejecutar endpoint del reto sin duplicación de rutas
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project /tmp/p43-reto/CursoWeb.ProductosApi.csproj --urls http://127.0.0.1:5085 > /tmp/p43-reto.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/p43-reto.log' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5085/api/productos/resumen > /tmp/reto.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/reto.json"))
          assert data["cantidad"]==2 and data["hayProductos"] is True,data
          assert abs(data["precioTotal"]-3.3)<0.001,data
          PY
      - name: Activar alternativa de error HTTP P4.1 en copia de Blazor
        shell: bash
        run: |
          set -euo pipefail
          cp -R M04_APIS_SEGURIDAD/PROYECTO/4.1/CursoWeb.Blazor /tmp/p41-reto
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/p41-reto/Components/Pages/CatalogoRemoto.razor")
          s=p.read_text()
          old='productos = await cliente.GetFromJsonAsync<List<ProductoDto>>("api/productos") ?? [];'
          new='''using var respuesta = await cliente.GetAsync("api/productos");
                      if (!respuesta.IsSuccessStatusCode)
                      {
                          error = $"La API respondió {(int)respuesta.StatusCode}.";
                          return;
                      }
                      productos = await respuesta.Content.ReadFromJsonAsync<List<ProductoDto>>() ?? [];'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          dotnet build /tmp/p41-reto/CursoWeb.Blazor.csproj -c Release
