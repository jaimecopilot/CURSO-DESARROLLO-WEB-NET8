name: M03 - PDF desde Markdown canónico
on:
  workflow_dispatch:
  push:
    branches: [desarrollo/m03-sobre-m02-validado]
    paths:
      - "M03_BLAZOR/TEORIA/M03_TEORIA.md"
      - "M03_BLAZOR/PRACTICAS/M03_PRACTICAS.md"
      - "M03_BLAZOR/DOCS/**"
      - ".github/workflows/m03-pdf.yml"
permissions:
  contents: write
concurrency:
  group: m03-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  m03-documentacion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar generador y verificador
        run: |
          python -m pip install "markdown-it-py>=3,<5" "pygments>=2.17,<3" "weasyprint>=63,<69" "pypdf>=5,<8" "pymupdf>=1.24,<2" "beautifulsoup4>=4.12,<5"
          sudo apt-get update -qq
          sudo apt-get install -y graphviz fonts-dejavu-core
      - name: Verificar trazabilidad de código completo por capítulo
        run: python M03_BLAZOR/DOCS/verificar_codigo_en_practicas.py
      - name: Generar PDF completos desde los Markdown
        run: python M03_BLAZOR/DOCS/generar_m03_pdf.py
      - name: Rasterizar todas las páginas
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          for typ in ("TEORIA","PRACTICAS"):
              pdf=Path("M03_BLAZOR")/typ/("M03_"+typ+".pdf")
              doc=fitz.open(pdf)
              for i,page in enumerate(doc):
                  image=page.get_pixmap(matrix=fitz.Matrix(0.65,0.65),alpha=False)
                  assert image.width>300 and image.height>400, (typ,i)
              print(typ,"páginas rasterizadas",len(doc))
          PY
      - name: Adjuntar documentación
        uses: actions/upload-artifact@v4
        with:
          name: m03-pdfs-fieles-a-md
          path: |
            M03_BLAZOR/TEORIA/M03_TEORIA.pdf
            M03_BLAZOR/PRACTICAS/M03_PRACTICAS.pdf
            VERIFICACION_INTERNA/M03_PDFS_VALIDACION.md
          if-no-files-found: error
      - name: Publicar PDF solo cuando HEAD permanezca estable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M03_BLAZOR/TEORIA/M03_TEORIA.pdf M03_BLAZOR/PRACTICAS/M03_PRACTICAS.pdf VERIFICACION_INTERNA/M03_PDFS_VALIDACION.md
          if git diff --cached --quiet; then
            echo "PDF ya publicados"
          else
            git commit -m "docs(m03): publicar PDF generados literalmente desde los MD"
            remote_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "::warning::Rama avanzada: este artefacto no debe sustituir a una versión más nueva"
              exit 0
            fi
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
