name: M04 - recorrido de autenticación con navegador
on:
  push:
    branches: [desarrollo/m04-reescritura-docente-integral]
    paths:
      - 'VERIFICACION_INTERNA/m04_seguir_login_browser.mjs'
      - '.github/workflows/m04-autenticacion-browser.yml'
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.4/**'
  workflow_dispatch:
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de prueba
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Compilar aplicación Blazor 4.4
        run: dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj -c Release
      - name: Probar el circuito en Chromium
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Development dotnet run --no-build --no-launch-profile -c Release --project M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj --urls http://127.0.0.1:5094 > /tmp/m04-browser.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/m04-browser.log' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5094/seguridad > /dev/null; then break; fi
            sleep 1
          done
          cp VERIFICACION_INTERNA/m04_seguir_login_browser.mjs ./m04_browser.mjs
          node m04_browser.mjs
