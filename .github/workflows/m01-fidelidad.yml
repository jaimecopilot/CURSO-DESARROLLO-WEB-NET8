name: M01 - Auditoria de fidelidad MD PDF

on:
  workflow_dispatch:
  push:
    branches: [desarrollo/m01-mvc]
    paths:
      - "VERIFICACION_INTERNA/auditar_fidelidad_m01.py"
      - ".github/workflows/m01-fidelidad.yml"

permissions:
  contents: read

jobs:
  recuento-solo-lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar extractor PDF y analizador Markdown
        run: python -m pip install "pymupdf>=1.24,<2" "markdown-it-py>=3,<5" "beautifulsoup4>=4.12,<5"
      - name: Contar punto a punto y comparar texto extraido
        run: python VERIFICACION_INTERNA/auditar_fidelidad_m01.py
