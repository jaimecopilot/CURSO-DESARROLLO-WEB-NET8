name: M04 - Blazor JWT sobre SQL Server LocalDB navegador
on:
  push:
    branches: [desarrollo/m04-reescritura-docente-integral]
    paths:
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.5/**'
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/Components/Pages/PerfilJwt.razor'
      - 'VERIFICACION_INTERNA/m04_identity_jwt_blazor.cjs'
      - '.github/workflows/m04-identity-jwt-blazor-e2e.yml'
  workflow_dispatch:
jobs:
  navegador-jwt-localdb:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DemoFormador__Email: formador@ejemplo.local
      DemoFormador__Password: 'ClaveDemoSegura-2026!'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Iniciar LocalDB y configurar secretos efímeros
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $command=Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $command) {
            $command=Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $command) { throw 'El runner no tiene SQL Server Express LocalDB' }
          $localdb=$command.Source
          if (-not $localdb) { $localdb=$command.FullName }
          & $localdb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { & $localdb create MSSQLLocalDB }
          & $localdb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo arrancar la instancia SQL Server Express LocalDB' }
          $secret=[Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          Add-Content $env:GITHUB_ENV "Jwt__SigningKey=$secret"
          $cs='Server=(localdb)\MSSQLLocalDB;Database=CursoWeb_M04_IdentityJwt_Browser_'+$env:GITHUB_RUN_ID+';Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true'
          Add-Content $env:GITHUB_ENV "ConnectionStrings__IdentityDb=$cs"
      - name: Instalar navegador
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Fallo npm' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Fallo instalación de Chromium' }
      - name: Compilar API Identity y Blazor
        shell: pwsh
        run: |
          dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.5/CursoWeb.IdentityJwtApi/CursoWeb.IdentityJwtApi.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallo compilación Identity' }
          dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallo compilación Blazor' }
      - name: Probar registro JWT perfil y rol en Chromium sobre LocalDB real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $api='M04_APIS_SEGURIDAD/PROYECTO/4.5/CursoWeb.IdentityJwtApi/CursoWeb.IdentityJwtApi.csproj'
          $blazor='M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj'
          $apiProcess=Start-Process dotnet -ArgumentList @('run','--no-build','-c','Release','--no-launch-profile','--project',$api,'--urls','http://127.0.0.1:5086') -PassThru -RedirectStandardOutput api.log -RedirectStandardError api-error.log
          $blazorProcess=Start-Process dotnet -ArgumentList @('run','--no-build','-c','Release','--no-launch-profile','--project',$blazor,'--urls','http://127.0.0.1:5094') -PassThru -RedirectStandardOutput blazor.log -RedirectStandardError blazor-error.log
          try {
            $ok=$false
            for ($i=0;$i -lt 180;$i++) {
              Start-Sleep -Seconds 2
              if ($apiProcess.HasExited -or $blazorProcess.HasExited) { break }
              try {
                $r1=Invoke-WebRequest 'http://127.0.0.1:5086/' -UseBasicParsing -TimeoutSec 3
                $r2=Invoke-WebRequest 'http://127.0.0.1:5094/perfil-jwt' -UseBasicParsing -TimeoutSec 3
                if ($r1.StatusCode -eq 200 -and $r2.StatusCode -eq 200) { $ok=$true;break }
              } catch { }
            }
            if (-not $ok) { throw 'No arrancaron API JWT/LocalDB y Blazor' }
            node VERIFICACION_INTERNA/m04_identity_jwt_blazor.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Falló el E2E del navegador sobre LocalDB' }
          } finally {
            Stop-Process -Id $apiProcess.Id,$blazorProcess.Id -Force -ErrorAction SilentlyContinue
            Get-Content api.log -Tail 20 -ErrorAction SilentlyContinue
            Get-Content api-error.log -Tail 20 -ErrorAction SilentlyContinue
            Get-Content blazor-error.log -Tail 20 -ErrorAction SilentlyContinue
          }
