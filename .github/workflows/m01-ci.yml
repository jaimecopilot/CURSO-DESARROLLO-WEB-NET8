name: M01 - E2E puntos 1.1 a 1.3

on:
  push:
    branches: [desarrollo/m01-mvc]
    paths:
      - "M01_MVC/**"
      - ".github/workflows/m01-ci.yml"
  pull_request:
    paths:
      - "M01_MVC/**"
      - ".github/workflows/m01-ci.yml"

jobs:
  m01-puntos-1-1-a-1-3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: P1.1 - MVC y HTTP
        run: bash M01_MVC/TESTS/1.1_e2e.sh
      - name: P1.2 - Modelo, Controlador y Vista
        run: bash M01_MVC/TESTS/1.2_e2e.sh
      - name: P1.3 - Estructura, configuración y recursos estáticos
        run: bash M01_MVC/TESTS/1.3_e2e.sh
