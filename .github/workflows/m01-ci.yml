name: M01 - E2E puntos 1.1 a 1.5

on:
  push:
    branches: [desarrollo/m01-mvc, revision-didactica/m01, desarrollo/reconstruccion-m01-m02-trazable]
    paths:
      - "M01_MVC/**"
      - ".github/workflows/m01-ci.yml"
  pull_request:
    paths:
      - "M01_MVC/**"
      - ".github/workflows/m01-ci.yml"

jobs:
  m01-puntos-1-1-a-1-5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Auditar trazabilidad MD-prácticas → bloques reales de código
        run: python M01_MVC/DOCS/auditar_trazabilidad_practicas.py
      - name: Contrastar competencias teoría, prácticas, código y ejecución
        run: python M01_MVC/DOCS/auditar_progresion_didactica.py
      - name: P1.1 - MVC y HTTP
        run: bash M01_MVC/TESTS/1.1_e2e.sh
      - name: P1.2 - Modelo, Controlador y Vista
        run: bash M01_MVC/TESTS/1.2_e2e.sh
      - name: P1.3 - Estructura, configuración y recursos estáticos
        run: bash M01_MVC/TESTS/1.3_e2e.sh
      - name: P1.4 - Acciones, parámetros y rutas
        run: bash M01_MVC/TESTS/1.4_e2e.sh
      - name: P1.5 - Razor, layout y parciales
        run: bash M01_MVC/TESTS/1.5_e2e.sh
      - name: Guardar matriz de trazabilidad verificada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-matriz-trazabilidad
          path: |
            VERIFICACION_INTERNA/M01_TRAZABILIDAD_CODIGO.md
            VERIFICACION_INTERNA/M01_MATRIZ_COMPETENCIAS.md
          if-no-files-found: warn
