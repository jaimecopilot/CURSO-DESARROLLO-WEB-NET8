name: M02 - Láminas para revisión visual
on:
  workflow_dispatch:
  push:
    branches: [desarrollo/m02-sobre-m01-aprobado]
    paths: [".github/workflows/m02-visual.yml"]
permissions:
  contents: write
jobs:
  revisar-todas-las-paginas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar rasterizador y Pillow
        run: python -m pip install "pymupdf>=1.24,<2" "pillow>=10,<12"
      - name: Componer vistas de todas las páginas
        run: python VERIFICACION_INTERNA/crear_vistas_m02.py
      - name: Sustituir láminas PNG pesadas por imágenes JPEG compactas
        run: rm -f VERIFICACION_INTERNA/M02_VISUAL/*_HOJA_*.png
      - name: Guardar láminas para revisión y descarga
        uses: actions/upload-artifact@v4
        with:
          name: m02-revision-visual
          path: VERIFICACION_INTERNA/M02_VISUAL/
          if-no-files-found: error
      - name: Conservar evidencias visuales en la rama M02
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A VERIFICACION_INTERNA/M02_VISUAL
          if ! git diff --cached --quiet; then
            git commit -m "quality(m02): generar vistas visuales de todas las páginas"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
