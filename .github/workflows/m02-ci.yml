name: M02 - E2E formularios, validacion, CRUD y Razor Pages

on:
  push:
    branches: [desarrollo/reconstruccion-m01-m02-trazable]
    paths:
      - "M02_FORMULARIOS_RAZOR/**"
      - ".github/workflows/m02-ci.yml"
  pull_request:
    paths:
      - "M02_FORMULARIOS_RAZOR/**"
      - ".github/workflows/m02-ci.yml"

jobs:
  m02-http-linux:
    name: P2.1-P2.3 - HTTP, antiforgery y validacion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: P2.1 - GET, POST, binding y antiforgery
        run: bash M02_FORMULARIOS_RAZOR/TESTS/2.1_e2e.sh
      - name: P2.2 - Tag Helpers sin cambiar el contrato HTTP
        run: bash M02_FORMULARIOS_RAZOR/TESTS/2.2_e2e.sh
      - name: P2.3 - DataAnnotations, ModelState y validacion
        run: bash M02_FORMULARIOS_RAZOR/TESTS/2.3_e2e.sh

  m02-localdb-windows:
    name: P2.4-P2.5 - LocalDB, CRUD y Razor Pages
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Comprobar SQL Server Express LocalDB
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            throw "El runner Windows no dispone de sqllocaldb."
          }
          sqllocaldb info
      - name: P2.4 - CRUD persistente y reinicio
        shell: pwsh
        run: '& ".\\M02_FORMULARIOS_RAZOR\\TESTS\\2.4_e2e.ps1"'
      - name: P2.5 - Razor Pages y coexistencia con MVC
        shell: pwsh
        run: '& ".\\M02_FORMULARIOS_RAZOR\\TESTS\\2.5_e2e.ps1"'
