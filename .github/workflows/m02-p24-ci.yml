name: M02 - CRUD LocalDB Windows
on:
  push:
    branches: [desarrollo/m02-sobre-m01-aprobado, desarrollo/reconstruccion-m01-m02-trazable]
    paths:
      - "M02_FORMULARIOS_RAZOR/PROYECTO/2.4/**"
      - "M02_FORMULARIOS_RAZOR/TESTS/2.4_e2e.ps1"
      - ".github/workflows/m02-p24-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p24-localdb:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Comprobar LocalDB de Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Command sqllocaldb -ErrorAction Stop
          sqllocaldb info
      - name: Ejecutar escenario CRUD con HTTP real y base aislada
        shell: pwsh
        run: ./M02_FORMULARIOS_RAZOR/TESTS/2.4_e2e.ps1
