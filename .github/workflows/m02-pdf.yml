name: M02 - PDF desde Markdown canónico
on:
  workflow_dispatch:
  push:
    branches: [desarrollo/m02-sobre-m01-aprobado]
    paths:
      - "M02_FORMULARIOS_RAZOR/TEORIA/M02_TEORIA.md"
      - "M02_FORMULARIOS_RAZOR/PRACTICAS/M02_PRACTICAS.md"
      - "M02_FORMULARIOS_RAZOR/DOCS/**"
      - ".github/workflows/m02-pdf.yml"
permissions:
  contents: write
concurrency:
  group: m02-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  m02-documentacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar maquetador y validadores de PDF
        run: |
          python -m pip install "markdown-it-py>=3,<5" "pygments>=2.17,<3" "weasyprint>=63,<69" "pypdf>=5,<8" "pymupdf>=1.24,<2" "beautifulsoup4>=4.12,<5"
          sudo apt-get update -qq
          sudo apt-get install -y graphviz fonts-dejavu-core
      - name: Comprobar las fuentes y generar dos PDF exactos
        run: python M02_FORMULARIOS_RAZOR/DOCS/generar_m02_pdf.py
      - name: Contrastar texto visible contra Markdown por capítulo
        run: python VERIFICACION_INTERNA/auditar_m02_fidelidad.py
      - name: Renderizar todas las páginas para inspección técnica
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          for typ in ("TEORIA","PRACTICAS"):
              pdf=Path("M02_FORMULARIOS_RAZOR")/typ/("M02_"+typ+".pdf")
              doc=fitz.open(pdf)
              for i,page in enumerate(doc):
                  # Se genera una imagen por página en una carpeta temporal
                  # para comprobar que todas se rasterizan sin excepción.
                  pix=page.get_pixmap(matrix=fitz.Matrix(0.65,0.65),alpha=False)
                  assert pix.width > 300 and pix.height > 400
              print(typ, "páginas rasterizadas:",len(doc))
          PY
      - name: Guardar PDF e informe como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: m02-pdf-desde-md
          path: |
            M02_FORMULARIOS_RAZOR/TEORIA/M02_TEORIA.pdf
            M02_FORMULARIOS_RAZOR/PRACTICAS/M02_PRACTICAS.pdf
            VERIFICACION_INTERNA/M02_PDFS_VALIDACION.md
            VERIFICACION_INTERNA/M02_FIDELIDAD.md
          if-no-files-found: error
      - name: Publicar únicamente PDF y métricas en rama M02
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M02_FORMULARIOS_RAZOR/TEORIA/M02_TEORIA.pdf M02_FORMULARIOS_RAZOR/PRACTICAS/M02_PRACTICAS.pdf VERIFICACION_INTERNA/M02_PDFS_VALIDACION.md VERIFICACION_INTERNA/M02_FIDELIDAD.md
          if git diff --cached --quiet; then
            echo "Los PDF ya corresponden a los Markdown."
          else
            git commit -m "docs(m02): publicar dos PDF y métricas derivados de MD"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
