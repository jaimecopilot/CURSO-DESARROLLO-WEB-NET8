name: M05 - medir PDF canónico sin publicar
on:
  push:
    branches: [desarrollo/m05-reescritura-docente-integral]
    paths:
      - 'M05_CONSOLIDACION_DESPLIEGUE/TEORIA/M05_TEORIA.md'
      - 'M05_CONSOLIDACION_DESPLIEGUE/PRACTICAS/M05_PRACTICAS.md'
      - 'M05_CONSOLIDACION_DESPLIEGUE/DOCS/**'
      - '.github/workflows/m05-medicion-pdf.yml'
  workflow_dispatch:
concurrency:
  group: m05-medicion-documental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  medir-documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar maquetación y comprobadores
        run: |
          python -m pip install 'markdown-it-py>=3,<5' 'pygments>=2.17,<3' 'weasyprint>=63,<69' 'pypdf>=5,<8' 'pymupdf>=1.24,<2' 'beautifulsoup4>=4.12,<5'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core graphviz
      - name: Comprobar delimitadores Markdown y bloques de código
        run: |
          python - <<'PY'
          from pathlib import Path
          from markdown_it import MarkdownIt
          for kind in ('TEORIA','PRACTICAS'):
              p=Path('M05_CONSOLIDACION_DESPLIEGUE')/kind/f'M05_{kind}.md'
              src=p.read_text(encoding='utf-8')
              assert chr(92)+chr(96) not in src, f'{kind}: acentos graves escapados que ocultan código'
              tokens=MarkdownIt('commonmark').parse(src)
              fences=[x for x in tokens if x.type=='fence']
              assert len(fences)>=15, f'{kind}: bloques de código insuficientemente renderizados ({len(fences)})'
              print(f'{kind}: {len(fences)} bloques de código Markdown reconocidos')
          PY
      - name: Medir extensión y fidelidad de PDF
        run: |
          python M05_CONSOLIDACION_DESPLIEGUE/DOCS/generar_m05_pdf.py
          echo "Estado de extensión:"
          cat VERIFICACION_INTERNA/M05_PDF_EXTENSION_OK.txt
      - name: Diagnóstico de todas las páginas
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for kind in ('TEORIA','PRACTICAS'):
            f=Path('M05_CONSOLIDACION_DESPLIEGUE')/kind/f'M05_{kind}.pdf'
            with fitz.open(f) as doc:
              for i,page in enumerate(doc):
                img=page.get_pixmap(matrix=fitz.Matrix(0.65,0.65),alpha=False)
                assert img.width>300 and img.height>400
                assert page.get_text().strip(),(kind,i+1)
                out=Path('VERIFICACION_INTERNA/M05_VISTAS_PAGINA')/kind
                out.mkdir(parents=True,exist_ok=True)
                img.save(out/f'{i+1:03d}.png')
              print(f'{kind}: {len(doc)} páginas procesadas, ninguna vacía')
          PY
      - name: Adjuntar PDF de ensayo, Markdown y resultados de fidelidad
        uses: actions/upload-artifact@v4
        with:
          name: m05-pdfs-desde-md-para-revision
          path: |
            M05_CONSOLIDACION_DESPLIEGUE/TEORIA/M05_TEORIA.pdf
            M05_CONSOLIDACION_DESPLIEGUE/PRACTICAS/M05_PRACTICAS.pdf
            M05_CONSOLIDACION_DESPLIEGUE/TEORIA/M05_TEORIA.md
            M05_CONSOLIDACION_DESPLIEGUE/PRACTICAS/M05_PRACTICAS.md
            VERIFICACION_INTERNA/M05_PDFS_VALIDACION.md
            VERIFICACION_INTERNA/M05_PDF_EXTENSION_OK.txt
          if-no-files-found: error
      - name: Adjuntar previsualizaciones de todas las páginas
        uses: actions/upload-artifact@v4
        with:
          name: m05-vistas-pagina-a-pagina
          path: VERIFICACION_INTERNA/M05_VISTAS_PAGINA
          if-no-files-found: error
      - name: No publicar PDF de documentación insuficiente
        run: |
          if [ "$(cat VERIFICACION_INTERNA/M05_PDF_EXTENSION_OK.txt)" != "OK" ]; then
            echo "::warning::El contenido aún no permite publicar los PDF como definitivos."
          fi
