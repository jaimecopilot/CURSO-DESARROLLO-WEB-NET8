name: M04 P4.1 - compilacion y contrato API
on:
  push:
    branches:
      - desarrollo/m04-apis-seguridad-trazable
    paths:
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.1/**'
      - '.github/workflows/m04-p41-ci.yml'
  workflow_dispatch:
jobs:
  p41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar API
        run: dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.1/CursoWeb.ProductosApi/CursoWeb.ProductosApi.csproj --configuration Release
      - name: Compilar Blazor
        run: dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.1/CursoWeb.Blazor/CursoWeb.Blazor.csproj --configuration Release
      - name: Probar GET POST 400 y 404 contra la API real
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-launch-profile --project M04_APIS_SEGURIDAD/PROYECTO/4.1/CursoWeb.ProductosApi/CursoWeb.ProductosApi.csproj --urls http://127.0.0.1:5081 > /tmp/p41-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/p41-api.log' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5081/api/productos > /tmp/p41-get.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p41-get.json'))
          assert len(data)==2, data
          assert {p['nombre'] for p in data}=={'Cuaderno','Lápiz'}, data
          PY
          response=$(curl -s -o /tmp/p41-post.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"nombre":"Regla","precio":1.75}' http://127.0.0.1:5081/api/productos)
          test "$response" = "201"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p41-post.json'))
          assert data['nombre']=='Regla' and data['precio']==1.75 and data['id']>2,data
          PY
          bad=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"nombre":"Regla","precio":0}' http://127.0.0.1:5081/api/productos)
          test "$bad" = "400"
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5081/api/productos/999)
          test "$missing" = "404"
