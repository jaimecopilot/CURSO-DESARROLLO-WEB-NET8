name: M04 - Identity JWT sobre SQL Server LocalDB E2E
on:
  push:
    branches: [desarrollo/m04-reescritura-docente-integral]
    paths:
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.5/**'
      - 'VERIFICACION_INTERNA/m04_identity_jwt_e2e.py'
      - 'VERIFICACION_INTERNA/m04_identity_j3_j6_desde_md.py'
      - 'M04_APIS_SEGURIDAD/PRACTICAS/M04_PRACTICAS.md'
      - '.github/workflows/m04-identity-jwt-ci.yml'
  workflow_dispatch:
jobs:
  identity-jwt-localdb:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DemoFormador__Email: formador@ejemplo.local
      DemoFormador__Password: 'ClaveDemoSegura-2026!'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preparar SQL Server Express LocalDB real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $cmd) {
            $cmd=Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $cmd) { throw 'No está instalado SQL Server Express LocalDB en runner Windows' }
          $localdb=$cmd.Source
          if (-not $localdb) { $localdb=$cmd.FullName }
          & $localdb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { & $localdb create MSSQLLocalDB }
          & $localdb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo arrancar MSSQLLocalDB' }
          & $localdb info MSSQLLocalDB
          $secret=[Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          Add-Content $env:GITHUB_ENV "Jwt__SigningKey=$secret"
          $cs='Server=(localdb)\MSSQLLocalDB;Database=CursoWeb_M04_IdentityJwt_CI_'+$env:GITHUB_RUN_ID+';Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true'
          Add-Content $env:GITHUB_ENV "ConnectionStrings__IdentityDb=$cs"
      - name: Compilar etapas J3-J6 directamente desde Markdown de prácticas
        shell: pwsh
        run: python VERIFICACION_INTERNA/m04_identity_j3_j6_desde_md.py
      - name: Compilar contra Microsoft.EntityFrameworkCore.SqlServer
        shell: pwsh
        run: dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.5/CursoWeb.IdentityJwtApi/CursoWeb.IdentityJwtApi.csproj -c Release
      - name: Registrar, autenticar y autorizar con base real LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='M04_APIS_SEGURIDAD/PROYECTO/4.5/CursoWeb.IdentityJwtApi/CursoWeb.IdentityJwtApi.csproj'
          $server=Start-Process dotnet -ArgumentList @('run','--no-build','-c','Release','--no-launch-profile','--project',$project,'--urls','http://127.0.0.1:5086') -PassThru -RedirectStandardOutput api.log -RedirectStandardError api-error.log
          try {
            $ok=$false
            for ($i=0;$i -lt 180;$i++) {
              Start-Sleep -Seconds 2
              if ($server.HasExited) { break }
              try {
                $response=Invoke-WebRequest 'http://127.0.0.1:5086/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ok=$true;break }
              } catch { }
            }
            if (-not $ok) { throw 'La API no pudo iniciar sobre SQL Server LocalDB' }
            python VERIFICACION_INTERNA/m04_identity_jwt_e2e.py
            if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas JWT/LocalDB' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Content api.log -Tail 30 -ErrorAction SilentlyContinue
            Get-Content api-error.log -Tail 30 -ErrorAction SilentlyContinue
          }
