name: M05 - integración real Blazor, API, Kestrel y Docker
on:
  push:
    branches: [desarrollo/m05-consolidacion-despliegue]
    paths:
      - 'M05_CONSOLIDACION_DESPLIEGUE/**'
      - '.github/workflows/m05-integracion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-real:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar los tres proyectos acumulativos
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/API/CursoWeb.ProductosApi/CursoWeb.ProductosApi.csproj \
            M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/BLAZOR/CursoWeb.Blazor/CursoWeb.Blazor.csproj \
            M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/MVC/CursoWeb.Mvc/CursoWeb.Mvc.csproj
          do dotnet build "$p" -c Release; done
      - name: API real, GET 200, 404, POST 201 y 400; host Blazor HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/API/CursoWeb.ProductosApi/CursoWeb.ProductosApi.csproj -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5081 > api.log 2>&1 &
          apid=$!
          dotnet run --project M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/BLAZOR/CursoWeb.Blazor/CursoWeb.Blazor.csproj -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5092 > blazor.log 2>&1 &
          bid=$!
          trap 'kill $apid $bid 2>/dev/null || true; tail -30 api.log; tail -30 blazor.log' EXIT
          python - <<'PY'
          import urllib.request,urllib.error,json,time
          def get(path):
              req=urllib.request.Request("http://127.0.0.1:5081"+path)
              try:
                  with urllib.request.urlopen(req,timeout=4) as r: return r.status,r.read()
              except urllib.error.HTTPError as e: return e.code,e.read()
          for i in range(80):
              try:
                  a,_=get("/api/productos")
                  with urllib.request.urlopen("http://127.0.0.1:5092/",timeout=4) as r: b=r.status
                  if a==b==200:break
              except Exception:pass
              time.sleep(1)
          else: raise AssertionError("API o Blazor no arrancaron")
          assert get("/api/productos/999")[0]==404
          req=urllib.request.Request("http://127.0.0.1:5081/api/productos",data=json.dumps({"nombre":"Regla","precio":1.75}).encode(),headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=5) as r:assert r.status==201 and json.load(r)["nombre"]=="Regla"
          req=urllib.request.Request("http://127.0.0.1:5081/api/productos",data=json.dumps({"nombre":"","precio":0}).encode(),headers={"Content-Type":"application/json"})
          try:urllib.request.urlopen(req,timeout=5);raise AssertionError("Debía devolver 400")
          except urllib.error.HTTPError as e:assert e.code==400
          a,data=get("/api/productos")
          assert a==200 and any(p["nombre"]=="Regla" for p in json.loads(data))
          print("GET 200/404, POST 201/400 y GET posterior: OK; host Blazor HTTP 200")
          PY
      - name: Publicar MVC y comprobar Kestrel real con modo sin LocalDB
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/mvc-publicado"
          dotnet publish M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/MVC/CursoWeb.Mvc/CursoWeb.Mvc.csproj -c Release -o "$dest"
          test -f "$dest/CursoWeb.Mvc.dll"
          test -f "$dest/CursoWeb.Mvc.runtimeconfig.json"
          test -f "$dest/wwwroot/css/site.css"
          (cd "$dest"; Despliegue__SinLocalDb=true dotnet CursoWeb.Mvc.dll --urls http://127.0.0.1:5091) > kestrel.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; tail -40 kestrel.log' EXIT
          python - <<'PY'
          import time,urllib.request,urllib.error
          def req(path):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:5091"+path,timeout=4) as r:return r.status,r.read()
              except urllib.error.HTTPError as e:return e.code,e.read()
          for i in range(80):
              try:
                  if req("/")[0]==200:break
              except Exception:pass
              time.sleep(1)
          else:raise AssertionError("Kestrel no responde")
          assert req("/Productos/Estado")[0]==200
          assert req("/css/site.css")[0]==200
          code,body=req("/Productos")
          assert code==503 and b"LocalDB" in body
          print("MVC publicado, Kestrel HTTP 200/200/200, CRUD 503 explícito: OK")
          PY
      - name: Docker build y contenedor Linux real
        shell: bash
        run: |
          set -euo pipefail
          cd M05_CONSOLIDACION_DESPLIEGUE/PROYECTO/MVC/CursoWeb.Mvc
          docker build -t cursoweb-mvc:m05 .
          docker run -d --name cursoweb-m05 -p 8081:8080 -e Despliegue__SinLocalDb=true cursoweb-mvc:m05
          trap 'docker logs cursoweb-m05 || true; docker rm -f cursoweb-m05 || true' EXIT
          python - <<'PY'
          import time,urllib.request,urllib.error
          def req(path):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8081"+path,timeout=4) as r:return r.status,r.read()
              except urllib.error.HTTPError as e:return e.code,e.read()
          for i in range(80):
              try:
                  if req("/")[0]==200:break
              except Exception:pass
              time.sleep(1)
          else:raise AssertionError("Contenedor no responde desde host")
          assert req("/Productos/Estado")[0]==200
          assert req("/css/site.css")[0]==200
          status,body=req("/Productos")
          assert status==503 and b"LocalDB" in body
          print("Docker Linux real y puerto host 8081 -> contenedor 8080: OK")
          PY
      - name: Alcance de las pruebas
        run: |
          echo "No se valida IIS ni la interacción browser Blazor mediante este workflow."
