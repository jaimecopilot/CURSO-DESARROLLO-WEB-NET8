name: M04 P4.4 - Blazor y recurso protegido
on:
  push:
    branches:
      - desarrollo/m04-apis-seguridad-trazable
    paths:
      - 'M04_APIS_SEGURIDAD/PROYECTO/4.4/**'
      - '.github/workflows/m04-p44-ci.yml'
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar cliente Blazor
        run: dotnet build M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj -c Release
      - name: Comprobar acceso anónimo denegado
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --no-launch-profile --project M04_APIS_SEGURIDAD/PROYECTO/4.4/CursoWeb.Blazor/CursoWeb.Blazor.csproj --urls http://127.0.0.1:5094 > /tmp/p44.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/p44.log' EXIT
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:5094/seguridad > /tmp/seguridad.html; then break; fi
            sleep 1
          done
          grep -q 'Seguridad básica' /tmp/seguridad.html
          status=$(curl -s -o /tmp/p44-denegado -w '%{http_code}' http://127.0.0.1:5094/demo/privado)
          test "$status" = "401"
